[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prompt-firewall"
description = "Two-stage classifier screening documents for indirect prompt-injection payloads before RAG ingestion"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
# Dataset construction only. transformers is used for its tokenizer alone --
# no torch, no GPU, no model weights -- to verify the corpus against the Stage 2
# token ceiling at build time. Nothing in the running service imports it, so the
# CPU-only, no-cloud-inference constraint is untouched.
data = [
    "transformers",
]

[tool.setuptools]
# Version lives in app/__init__.py so there is one source of truth for it,
# and the health endpoint reports the same string the package declares.
#
# `datagen` is deliberately absent: the corpus is an input to fine-tuning, not
# a runtime dependency of the classifier, so it is not part of the installed
# distribution. It stays importable from the repository root for the scripts
# and the test suite.
packages = ["app", "app.models", "app.routers", "app.detection"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repository root on sys.path, so the test suite imports app.* without
# a path shim in conftest.py.
pythonpath = ["."]
addopts = "-q"
